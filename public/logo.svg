<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <defs>
    <!-- Background Substrate Gradient -->
    <linearGradient id="fullBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="50%" stop-color="#050811"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>

    <!-- Outer Border Glow Gradient -->
    <linearGradient id="fullBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Core Dynamic Delta / D Gradient -->
    <linearGradient id="fullDynepCoreGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="45%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Wordmark Typography Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>

    <radialGradient id="fullCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>

    <filter id="fullGlowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- ==================== LEFT ICON MARK (0-90) ==================== -->
  <g transform="translate(6, 6) scale(0.73)">
    <!-- Outer Silicon Die Enclosure -->
    <rect x="8" y="8" width="104" height="104" rx="24" fill="url(#fullBgGrad)" stroke="url(#fullBorderGrad)" stroke-width="2"/>

    <!-- Micro-Pins Top -->
    <line x1="42" y1="8" x2="42" y2="15" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <line x1="50" y1="8" x2="50" y2="17" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="60" y1="8" x2="60" y2="18" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="70" y1="8" x2="70" y2="17" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="78" y1="8" x2="78" y2="15" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

    <!-- Micro-Pins Bottom -->
    <line x1="42" y1="112" x2="42" y2="105" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <line x1="50" y1="112" x2="50" y2="103" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="60" y1="112" x2="60" y2="102" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="70" y1="112" x2="70" y2="103" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="78" y1="112" x2="78" y2="105" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

    <!-- Micro-Pins Left & Right -->
    <line x1="8" y1="50" x2="16" y2="50" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <line x1="8" y1="60" x2="18" y2="60" stroke="#34d399" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="8" y1="70" x2="16" y2="70" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <line x1="112" y1="50" x2="104" y2="50" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
    <line x1="112" y1="60" x2="102" y2="60" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="112" y1="70" x2="104" y2="70" stroke="#06b6d4" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

    <!-- Inner Core Frame -->
    <rect x="22" y="22" width="76" height="76" rx="14" fill="#060b16" stroke="#1e293b" stroke-width="1.2"/>

    <!-- Core D / Delta -->
    <g filter="url(#fullGlowFilter)">
      <path d="M 37 32 L 56 32 C 74 32, 85 43, 85 60 C 85 77, 74 88, 56 88 L 37 88 Z" 
            fill="none" stroke="url(#fullDynepCoreGrad)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M 47 77 L 60 42 L 73 77 Z" fill="url(#fullDynepCoreGrad)"/>
      <path d="M 60 52 L 66 71 L 54 71 Z" fill="#060b16"/>
      <line x1="33" y1="60" x2="87" y2="60" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="3.2" fill="#ffffff"/>
    </g>
  </g>

  <!-- ==================== TYPOGRAPHIC WORDMARK ==================== -->
  <!-- "DYNEP" Brand Title -->
  <text x="110" y="56" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="900" letter-spacing="0.04em" fill="url(#textGrad)">
    DYNEP
  </text>

  <!-- Micro-Badge "DaaS" -->
  <g transform="translate(282, 28)">
    <rect x="0" y="0" width="54" height="20" rx="5" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
    <text x="27" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="0.08em">
      DaaS
    </text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="112" y="77" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="500" letter-spacing="0.14em" fill="#64748b">
    AI CLOUD GPU SPOT EXCHANGE
  </text>

  <!-- 31 Providers Indicator Dot -->
  <circle cx="348" cy="74" r="3" fill="#10b981"/>
  <text x="356" y="77" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#10b981" letter-spacing="0.06em">
    31 CLOUDS
  </text>
</svg>
