services:
  - type: web
    name: micro-daas-engine
    runtime: docker
    plan: starter
    region: frankfurt # Low latency to Europe / Israel / US
    healthCheckPath: /health
    disk:
      name: daas-data-disk
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: HOST
        value: 0.0.0.0
      - key: ENABLE_CRON_SCHEDULER
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: ADMIN_API_KEY
        generateValue: true
      - key: DEFAULT_MONTHLY_QUOTA
        value: "1000"
      - key: DEFAULT_RATE_LIMIT_RPM
        value: "60"
      - key: POLAR_WEBHOOK_SECRET
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
