version: '3.8'

services:
  # 1. Micro-DaaS API Gateway
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/index.js", "--mode=api"]
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-daas_admin_secret_key_2026}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 2. Autonomous Scraping Cron Worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/index.js", "--mode=worker"]
    environment:
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL}
      - ENABLE_CRON_SCHEDULER=true
    restart: unless-stopped
